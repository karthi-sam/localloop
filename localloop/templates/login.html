<!DOCTYPE html>
<html>
<head>
    <title>Kascalo Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background: linear-gradient(135deg,#dff4ff,#edf7ff,#ffffff);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:430px;
        }

        .box{
            background:white;
            padding:35px;
            border-radius:28px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
            border:1px solid #dbeeff;
        }

        .logo{
            text-align:center;
            margin-bottom:25px;
        }

        .logo h1{
            color:#2196f3;
            font-size:34px;
            font-weight:700;
        }

        .logo p{
            color:#6b7c93;
            margin-top:5px;
            font-size:14px;
        }

        .form-title{
            font-size:22px;
            font-weight:600;
            color:#1d3557;
            margin-bottom:20px;
            text-align:center;
        }

        .input-group{
            margin-bottom:16px;
        }

        .input-group label{
            display:block;
            margin-bottom:6px;
            font-size:14px;
            color:#355070;
            font-weight:500;
        }

        input,select,textarea{
            width:100%;
            padding:13px 15px;
            border-radius:14px;
            border:1px solid #cfe6ff;
            background:#f8fcff;
            outline:none;
            transition:0.2s;
            font-size:14px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border-color:#42a5f5;
            background:white;
            box-shadow:0 0 0 4px rgba(66,165,245,0.15);
        }

        textarea{
            resize:none;
            min-height:90px;
        }

        .btn{
            width:100%;
            border:none;
            padding:14px;
            border-radius:16px;
            background:linear-gradient(135deg,#42a5f5,#1e88e5);
            color:white;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            transition:0.2s;
            margin-top:5px;
        }

        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(30,136,229,0.25);
        }

        .toggle{
            text-align:center;
            margin-top:18px;
            color:#2196f3;
            cursor:pointer;
            font-size:14px;
            font-weight:500;
        }

        .hidden{
            display:none;
        }

        .section-title{
            margin-top:18px;
            margin-bottom:10px;
            color:#1d3557;
            font-size:15px;
            font-weight:600;
            border-left:4px solid #42a5f5;
            padding-left:10px;
        }

        .error{
            background:#ffe5e5;
            color:#d63031;
            padding:12px;
            border-radius:12px;
            margin-top:15px;
            text-align:center;
            font-size:14px;
        }

        .category-box{
            background:#f6fbff;
            border:1px solid #d6ebff;
            padding:15px;
            border-radius:18px;
            margin-top:10px;
        }

        @media(max-width:500px){
            .box{
                padding:25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <div class="logo">
            <h1>LocalLoop</h1>
            <p>Connect • Jobs • Services • Business • Community</p>
        </div>

        <!-- LOGIN -->
        <form method="POST" id="loginForm">

            <div class="form-title">Welcome Back</div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>

            <button class="btn" type="submit" name="action" value="login">
                Login
            </button>
        </form>

        <!-- REGISTER -->
        <form method="POST" id="registerForm" class="hidden">

            <div class="form-title">Create Account</div>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="username" placeholder="Enter full name" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email" required>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" name="phone" placeholder="Enter phone number" required>
            </div>

            <div class="input-group">
                <label>User Type</label>

                <select name="category" id="category" onchange="showFields()" required>
                    <option value="">Select user type</option>

                    <option value="public">Public User</option>

                    <option value="recruiter ">recruiter </option>

                    <option value="business">Business / Service</option>

                    <option value="shop">Shop</option>
                </select>
            </div>

            <!-- COMMON -->
            <div class="category-box">

                <div class="input-group">
                    <label>Address / Location</label>
                    <input type="text" name="location" placeholder="Enter address">
                </div>

                <div class="input-group">
                    <label>Google Map Link</label>
                    <input type="text" name="map_link" placeholder="Paste Google map link">
                </div>

            </div>

            <!-- JOB -->
            <div id="jobFields" class="hidden">

                <div class="section-title">
                    Company Information
                </div>

                <div class="category-box">

                    <div class="input-group">
                        <label>Company Name (Optional)</label>
                        <input type="text" name="company_name" placeholder="Enter company name">
                    </div>

                    <div class="input-group">
                        <label>Job Type</label>
                        <input type="text" name="job_type" placeholder="Ex: Accountant, Driver">
                    </div>

                </div>
            </div>

            <!-- BUSINESS -->
            <div id="businessFields" class="hidden">

                <div class="section-title">
                    Business / Service Details
                </div>

                <div class="category-box">

                    <div class="input-group">
                        <label>Business Name</label>
                        <input type="text" name="business_name" placeholder="Business or service name">
                    </div>

                    <div class="input-group">
                        <label>Service Type</label>
                        <input type="text" name="service_type" placeholder="Plumbing, AC Repair, Tuition">
                    </div>

                    <div class="input-group">
                        <label>Individual or Group</label>
                        <select name="business_mode">
                            <option value="">Select</option>
                            <option value="individual">Individual</option>
                            <option value="group">Group / Company</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Business Description</label>
                        <textarea name="service_description" placeholder="Describe your services"></textarea>
                    </div>

                </div>
            </div>

            <!-- SHOP -->
            <div id="shopFields" class="hidden">

                <div class="section-title">
                    Shop Information
                </div>

                <div class="category-box">

                    <div class="input-group">
                        <label>Shop Name</label>
                        <input type="text" name="shop_name" placeholder="Enter shop name">
                    </div>

                    <div class="input-group">
                        <label>Shop Category</label>
                        <input type="text" name="shop_type" placeholder="Grocery, Mobile Shop">
                    </div>

                </div>
            </div>

            <!-- ALERT -->
            <div id="alertFields" class="hidden">

                <div class="section-title">
                    Alert Information
                </div>

                <div class="category-box">

                    <div class="input-group">
                        <label>Alert Type</label>
                        <input type="text" name="alert_type" placeholder="Medical, Traffic, Emergency">
                    </div>

                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create password" required>
            </div>

            <button class="btn" type="submit" name="action" value="register">
                Register
            </button>
        </form>

        <!-- TOGGLE -->
        <div class="toggle" onclick="toggleForm()" id="toggleText">
            Don't have an account? Register
        </div>

        <!-- ERROR -->
        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

    </div>
</div>

<script>

    // LOGIN / REGISTER TOGGLE
    function toggleForm(){

        let login = document.getElementById("loginForm");
        let register = document.getElementById("registerForm");
        let text = document.getElementById("toggleText");

        if(login.classList.contains("hidden")){

            login.classList.remove("hidden");
            register.classList.add("hidden");

            text.innerText = "Don't have an account? Register";

        }else{

            login.classList.add("hidden");
            register.classList.remove("hidden");

            text.innerText = "Already have an account? Login";
        }
    }

    // SHOW CATEGORY FIELDS
    function showFields(){

        let category = document.getElementById("category").value;

        document.getElementById("jobFields").classList.add("hidden");
        document.getElementById("businessFields").classList.add("hidden");
        document.getElementById("shopFields").classList.add("hidden");
        document.getElementById("alertFields").classList.add("hidden");

        if(category === "job"){
            document.getElementById("jobFields").classList.remove("hidden");
        }

        else if(category === "business"){
            document.getElementById("businessFields").classList.remove("hidden");
        }

        else if(category === "shop"){
            document.getElementById("shopFields").classList.remove("hidden");
        }

        else if(category === "alert"){
            document.getElementById("alertFields").classList.remove("hidden");
        }
    }

</script>

</body>
</html>
